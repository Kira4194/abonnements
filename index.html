<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
<title>Mes abonnements</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--texte); font-family: Inter, system-ui, -apple-system, Roboto, sans-serif;
    padding-bottom: 110px; transition: background .6s, color .6s; }
  .ecran { max-width: 430px; margin: 0 auto; padding: 18px 16px 0; }

  /* Thèmes : toutes les couleurs passent par ces variables */
  body { --bg: #0c0f0d; --carte: #161b18; --carte2: #1e2420; --texte: #f1f5f2; --muet: #8a948d; --ligne: rgba(255,255,255,.07);
    --accent: #b8f5c2; --accent-texte: #0b1a10; --glow: rgba(126,232,154,.3);
    --solde: linear-gradient(150deg, #b8f5c2 0%, #7ee89a 55%, #4fd17a 100%); --solde-texte: #0b1a10;
    --nav: #151a17; --rouge: #ff6b6b; --orange: #ffb547; --ok: #7ee89a; }

  /* En-tête */
  .haut { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .haut .salut { color: var(--muet); font-size: .85rem; }
  .haut .titre { font-size: 1.35rem; font-weight: 800; margin-top: 2px; }
  .rond { width: 42px; height: 42px; border-radius: 50%; background: var(--carte2); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--accent); }

  /* Badge de thème */
  .theme { display: flex; justify-content: space-between; align-items: center; background: var(--carte); border: 1px solid var(--ligne);
    border-radius: 999px; padding: 6px 6px 6px 14px; margin-bottom: 14px; font-size: .8rem; color: var(--muet); }
  .theme b { color: var(--texte); font-weight: 700; }
  .theme button { background: var(--accent); color: var(--accent-texte); border: none; border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 700; font-size: .78rem; cursor: pointer; }
  .points { display: flex; gap: 5px; margin-left: 8px; }
  .points i { width: 6px; height: 6px; border-radius: 50%; background: var(--muet); opacity: .4; transition: all .4s; }
  .points i.on { opacity: 1; background: var(--accent); width: 14px; border-radius: 4px; }

  /* Bloc de solde */
  .solde { border-radius: 26px; padding: 20px; background: var(--solde); color: var(--solde-texte); box-shadow: 0 12px 40px var(--glow); }
  .solde .label { font-size: .85rem; opacity: .75; font-weight: 600; }
  .solde .montant { font-size: 2.4rem; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 16px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pastille { background: rgba(0,0,0,.35); color: #fff; border-radius: 16px; padding: 10px 12px; backdrop-filter: blur(6px); }
  .pastille .k { font-size: .72rem; opacity: .75; }
  .pastille .v { font-weight: 800; font-size: 1rem; }

  /* Boutons d'action */
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 8px; }
  .action { background: var(--carte); border: 1px solid var(--ligne); border-radius: 18px; padding: 14px 6px; text-align: center; color: var(--texte); cursor: pointer; font: inherit; }
  .action .cercle { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 8px; background: var(--carte2); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--accent); box-shadow: 0 0 14px var(--glow); }
  .action span { font-size: .78rem; font-weight: 600; }

  /* Sections */
  .section { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 10px; }
  .section h2 { font-size: 1.05rem; margin: 0; }
  .section a { color: var(--accent); font-size: .85rem; font-weight: 600; cursor: pointer; }
  .filtres { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .filtres::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: var(--carte); border: 1px solid var(--ligne); color: var(--muet); padding: 8px 14px; border-radius: 999px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
  .chip.actif { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }

  /* Alertes */
  .alerte { background: rgba(255,181,71,.12); border: 1px solid rgba(255,181,71,.35); color: var(--orange); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; font-size: .9rem; }
  .alerte.urgent { background: rgba(255,107,107,.12); border-color: rgba(255,107,107,.4); color: var(--rouge); }

  /* Cartes */
  .carte { background: var(--carte); border-radius: 20px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--ligne); backdrop-filter: blur(8px); }
  .haut2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #111; flex: 0 0 auto; box-shadow: 0 0 14px var(--glow); }
  .logo img { width: 28px; height: 28px; object-fit: contain; }
  .logo.avec-image { background: #fff !important; }
  .infos { flex: 1; min-width: 0; }
  .infos .nom { font-weight: 700; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .infos .sous { font-size: .75rem; color: var(--muet); margin-top: 2px; }
  .prix { text-align: right; }
  .prix .montant { font-weight: 800; font-size: 1rem; }
  .prix .per { font-size: .72rem; color: var(--muet); }
  .barre { height: 6px; background: var(--carte2); border-radius: 6px; margin: 12px 0 8px; overflow: hidden; }
  .barre div { height: 100%; border-radius: 6px; }
  .pied { display: flex; justify-content: space-between; align-items: center; font-size: .78rem; color: var(--muet); }
  .badge { font-size: .72rem; padding: 3px 9px; border-radius: 999px; font-weight: 700; }
  .supp { background: none; border: none; color: var(--rouge); font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; padding: 4px; }
  .vide { text-align: center; color: var(--muet); padding: 40px 10px; font-size: .92rem; }

  /* Répartition */
  .repart { display: flex; height: 12px; border-radius: 8px; overflow: hidden; background: var(--carte2); }
  .repart div { height: 100%; }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .78rem; color: var(--muet); }
  .legende i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  /* Barre du bas */
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; width: calc(100% - 32px); max-width: 398px; height: 70px;
    background: var(--nav); border: 1px solid var(--ligne); border-radius: 26px; display: flex; justify-content: space-around; align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 5; transition: background .6s; }
  .nav button { background: none; border: none; color: var(--muet); font: inherit; font-size: .68rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px 10px; }
  .nav button.on { color: var(--accent); }
  .nav button .ic { font-size: 1.2rem; }
  .nav .fab { width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-texte); font-size: 1.9rem; font-weight: 300; display: flex; align-items: center; justify-content: center; margin-top: -26px; box-shadow: 0 8px 24px var(--glow); padding: 0; }

  /* Fenêtre d'ajout */
  .voile { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .voile.ouvert { display: flex; }
  .feuille { background: var(--nav); width: 100%; max-width: 430px; border-radius: 26px 26px 0 0; padding: 22px 18px 28px; max-height: 92vh; overflow-y: auto; }
  .feuille h3 { margin: 0 0 14px; font-size: 1.1rem; }
  form { display: grid; gap: 12px; }
  label { font-size: .78rem; color: var(--muet); display: grid; gap: 6px; }
  input, select { background: var(--carte2); color: var(--texte); border: 1px solid var(--ligne); border-radius: 14px; padding: 13px; font: inherit; font-size: 1rem; width: 100%; color-scheme: dark; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .erreur { color: var(--rouge); font-size: .85rem; min-height: 1em; }
  .boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: none; border-radius: 16px; padding: 14px; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; }
  .btn.principal { background: var(--accent); color: var(--accent-texte); }
  .btn.fantome { background: var(--carte2); color: var(--texte); }
  #autreBloc { display: none; }
</style>
</head>
<body>

<div class="ecran">

  <div class="haut">
    <div>
      <div class="salut" id="salut">Bonjour</div>
      <div class="titre">Mes abonnements</div>
    </div>
    <div class="rond">A</div>
  </div>

  <div class="theme">
    <span>Thème : <b id="nomTheme">Vert nuit</b></span>
    <span style="display:flex;align-items:center">
      <span class="points" id="points"></span>
      <button id="btnPause">Pause</button>
    </span>
  </div>

  <div class="solde">
    <div class="label">Dépense mensuelle</div>
    <div class="montant" id="totalMois">0,00 €</div>
    <div class="duo">
      <div class="pastille"><div class="k">Par an</div><div class="v" id="totalAn">0,00 €</div></div>
      <div class="pastille"><div class="k">Abonnements</div><div class="v" id="nbAbos">0</div></div>
    </div>
  </div>

  <div class="actions">
    <button class="action" id="actAjout"><div class="cercle">+</div><span>Ajouter</span></button>
    <button class="action" id="actAlertes"><div class="cercle">!</div><span>Alertes</span></button>
    <button class="action" id="actStats"><div class="cercle">%</div><span>Répartition</span></button>
  </div>

  <div id="zoneAlertes"></div>

  <div class="section"><h2>Catégories</h2></div>
  <div class="filtres" id="filtres"></div>

  <div class="section"><h2>Mes abonnements</h2><a id="triInfo">Par date</a></div>
  <div id="liste"></div>

  <div class="section" id="ancreRepart"><h2>Répartition</h2></div>
  <div class="carte" id="cardRepart">
    <div class="repart" id="barres"></div>
    <div class="legende" id="legende"></div>
  </div>

</div>

<nav class="nav">
  <button class="on" id="navAccueil"><span class="ic">⌂</span>Accueil</button>
  <button id="navStats"><span class="ic">◔</span>Stats</button>
  <button class="fab" id="navAjout" aria-label="Ajouter">+</button>
  <button id="navAlertes"><span class="ic">◉</span>Alertes</button>
  <button id="navListe"><span class="ic">≡</span>Liste</button>
</nav>

<div class="voile" id="voile">
  <div class="feuille">
    <h3>Nouvel abonnement</h3>
    <form id="formulaire">
      <label>Nom
        <input type="text" id="nom" required placeholder="Ex. Netflix">
      </label>
      <div class="deux">
        <label>Montant (€)
          <input type="number" id="montant" step="0.01" min="0" required placeholder="13.49">
        </label>
        <label>Période
          <select id="periode">
            <option value="mois">Mensuel</option>
            <option value="trimestre">Trimestriel</option>
            <option value="an">Annuel</option>
          </select>
        </label>
      </div>
      <label>Prochain prélèvement
        <input type="date" id="echeance" required>
      </label>
      <label>Catégorie
        <select id="categorie">
          <option>Streaming</option>
          <option>Téléphone / Internet</option>
          <option>Logiciel</option>
          <option>Musique</option>
          <option>Jeux</option>
          <option>Transport</option>
          <option>Autre</option>
        </select>
      </label>
      <label id="autreBloc">Précisez la catégorie
        <input type="text" id="categorieAutre" placeholder="Ex. Hébergement serveur">
      </label>
      <label>Site web (facultatif, pour le logo)
        <input type="text" id="site" placeholder="Ex. netflix.com">
      </label>
      <div class="erreur" id="erreur"></div>
      <div class="boutons">
        <button type="button" class="btn fantome" id="btnAnnuler">Annuler</button>
        <button type="submit" class="btn principal">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ---------- Thèmes (changent toutes les 60 secondes) ----------
  const THEMES = [
    { nom: "Vert nuit", vars: {
        "--bg": "#0c0f0d", "--carte": "#161b18", "--carte2": "#1e2420", "--texte": "#f1f5f2", "--muet": "#8a948d",
        "--ligne": "rgba(255,255,255,.07)", "--accent": "#b8f5c2", "--accent-texte": "#0b1a10", "--glow": "rgba(126,232,154,.3)",
        "--solde": "linear-gradient(150deg,#b8f5c2 0%,#7ee89a 55%,#4fd17a 100%)", "--solde-texte": "#0b1a10",
        "--nav": "#151a17", "--rouge": "#ff6b6b", "--orange": "#ffb547" } },
    { nom: "Violet & rose", vars: {
        "--bg": "#1a1638", "--carte": "#241f4a", "--carte2": "#2f2960", "--texte": "#f4f0ff", "--muet": "#a9a3d6",
        "--ligne": "rgba(255,255,255,.08)", "--accent": "#ff7ac8", "--accent-texte": "#1a1638", "--glow": "rgba(255,122,200,.4)",
        "--solde": "linear-gradient(150deg,#3a2d7a 0%,#6b3fb5 55%,#ff7ac8 100%)", "--solde-texte": "#ffffff",
        "--nav": "#211c44", "--rouge": "#ff5c7a", "--orange": "#ffb547" } },
    { nom: "Bleu & lime", vars: {
        "--bg": "#0b1426", "--carte": "#14203d", "--carte2": "#1c2c52", "--texte": "#eef3ff", "--muet": "#8ea0c8",
        "--ligne": "rgba(255,255,255,.07)", "--accent": "#d4ff3a", "--accent-texte": "#0b1426", "--glow": "rgba(212,255,58,.3)",
        "--solde": "linear-gradient(150deg,#2b5cd6 0%,#7a6cff 55%,#d4ff3a 120%)", "--solde-texte": "#ffffff",
        "--nav": "#101b33", "--rouge": "#ff6b6b", "--orange": "#ffb547" } },
    { nom: "Corail & ambre", vars: {
        "--bg": "#1c1012", "--carte": "#2a181b", "--carte2": "#3a2226", "--texte": "#fff2ee", "--muet": "#b89a94",
        "--ligne": "rgba(255,255,255,.07)", "--accent": "#ffb547", "--accent-texte": "#1c1012", "--glow": "rgba(255,142,83,.35)",
        "--solde": "linear-gradient(150deg,#ff6b6b 0%,#ff8e53 55%,#ffb547 100%)", "--solde-texte": "#1c1012",
        "--nav": "#24151a", "--rouge": "#ff6b6b", "--orange": "#ffd27a" } }
  ];
  let indexTheme = 0;
  let pause = false;
  const DUREE_THEME = 60000;

  function appliquerTheme(i) {
    indexTheme = i;
    const t = THEMES[i];
    Object.entries(t.vars).forEach(([k, v]) => document.body.style.setProperty(k, v));
    document.getElementById("nomTheme").textContent = t.nom;
    const pts = document.getElementById("points");
    pts.innerHTML = THEMES.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("");
  }
  setInterval(() => { if (!pause) appliquerTheme((indexTheme + 1) % THEMES.length); }, DUREE_THEME);
  document.getElementById("btnPause").onclick = e => {
    pause = !pause;
    e.target.textContent = pause ? "Reprendre" : "Pause";
  };
  appliquerTheme(0);

  // ---------- Données ----------
  const CLE = "mes-abonnements-v2";
  const JOURS_ALERTE = 7;
  const MOIS = { mois: 1, trimestre: 3, an: 12 };
  const LIBELLE = { mois: "mois", trimestre: "trimestre", an: "an" };
  const COULEURS = {
    "Streaming": "#ff7a8a", "Téléphone / Internet": "#7ab8ff", "Logiciel": "#c4a7ff",
    "Musique": "#7ee89a", "Jeux": "#ffc857", "Transport": "#6ee7f5", "Autre": "#b8c0ba"
  };
  const SITES = { "crunchyroll": "crunchyroll.com", "claude": "claude.ai", "hetzner": "hetzner.com", "cloudflare": "cloudflare.com" };
  let filtre = "Tous";
  let triParDate = true;

  // Abonnements de départ (une seule fois, sur cet appareil)
  const DEPART = [
    { nom: "Crunchyroll", montant: 6.99, periode: "mois", echeance: "2026-11-10", categorie: "Streaming" },
    { nom: "Claude", montant: 21.60, periode: "mois", echeance: "2026-11-28", categorie: "Logiciel" },
    { nom: "Hetzner", montant: 6.59, periode: "mois", echeance: "2026-12-03", categorie: "Autre" },
    { nom: "Cloudflare", montant: 20.00, periode: "mois", echeance: "2026-12-07", categorie: "Autre" }
  ];
  if (!localStorage.getItem("seed-v1")) {
    try {
      if (!localStorage.getItem(CLE)) {
        localStorage.setItem(CLE, JSON.stringify(DEPART.map((a, i) => ({ id: "dep" + i, ...a }))));
      }
      localStorage.setItem("seed-v1", "1");
    } catch (e) { /* stockage indisponible : la liste reste vide */ }
  }

  function charger() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function sauver(l) { try { localStorage.setItem(CLE, JSON.stringify(l)); return true; } catch (e) { return false; } }

  function aujourdhui() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function parseDate(s) { const [a, m, j] = s.split("-").map(Number); return new Date(a, m - 1, j); }
  function versTexte(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function avancer(d, p) { const n = new Date(d); n.setMonth(n.getMonth() + MOIS[p]); return n; }
  function enTexte(d) { return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }); }
  function joursAvant(s) { return Math.round((parseDate(s) - aujourdhui()) / 86400000); }
  function mettreAJour(l) {
    const auj = aujourdhui(); let m = false;
    l.forEach(a => {
      let d = parseDate(a.echeance);
      while (d < auj) { d = avancer(d, a.periode); m = true; }
      a.echeance = versTexte(d);
    });
    if (m) sauver(l);
    return l;
  }

  function euros(n) { return n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" }); }
  function echapper(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function couleur(c) { return COULEURS[c] || COULEURS["Autre"]; }
  function mensuel(a) { return a.montant / MOIS[a.periode]; }
  function quand(j) { return j <= 0 ? "aujourd'hui" : j === 1 ? "demain" : `dans ${j} j`; }

  // ---------- Rendu ----------
  function rendu() {
    const liste = mettreAJour(charger());
    const total = liste.reduce((s, a) => s + mensuel(a), 0);
    document.getElementById("totalMois").textContent = euros(total);
    document.getElementById("totalAn").textContent = euros(total * 12);
    document.getElementById("nbAbos").textContent = liste.length;

    const h = new Date().getHours();
    document.getElementById("salut").textContent = h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonsoir";

    const cats = ["Tous", ...new Set(liste.map(a => a.categorie || "Autre"))];
    if (!cats.includes(filtre)) filtre = "Tous";
    const f = document.getElementById("filtres");
    f.innerHTML = "";
    cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "chip" + (c === filtre ? " actif" : "");
      b.textContent = c;
      b.onclick = () => { filtre = c; rendu(); };
      f.appendChild(b);
    });

    const zone = document.getElementById("zoneAlertes");
    zone.innerHTML = "";
    liste.forEach(a => {
      const j = joursAvant(a.echeance);
      if (j <= JOURS_ALERTE) {
        zone.insertAdjacentHTML("beforeend",
          `<div class="alerte${j <= 2 ? " urgent" : ""}">${echapper(a.nom)} (${euros(a.montant)}) se prélève ${quand(j)}.</div>`);
      }
    });

    const vues = liste.filter(a => filtre === "Tous" || (a.categorie || "Autre") === filtre);
    vues.sort((a, b) => triParDate ? a.echeance.localeCompare(b.echeance) : a.nom.localeCompare(b.nom));
    document.getElementById("triInfo").textContent = triParDate ? "Par date" : "Par nom";

    const conteneur = document.getElementById("liste");
    conteneur.innerHTML = "";
    if (vues.length === 0) {
      conteneur.innerHTML = `<div class="vide">Aucun abonnement${filtre !== "Tous" ? " dans cette catégorie" : ""}.<br>Touchez + pour en ajouter un.</div>`;
    }
    vues.forEach(a => {
      const j = joursAvant(a.echeance);
      const cycle = MOIS[a.periode] * 30;
      const pct = Math.round((1 - Math.max(0, Math.min(1, j / cycle))) * 100);
      const bc = j <= 2 ? "var(--rouge)" : j <= JOURS_ALERTE ? "var(--orange)" : "var(--ok)";
      const badgeFond = j <= 2 ? "rgba(255,107,107,.15)" : j <= JOURS_ALERTE ? "rgba(255,181,71,.15)" : "rgba(126,232,154,.12)";
      const badgeTexte = j <= 2 ? "var(--rouge)" : j <= JOURS_ALERTE ? "var(--orange)" : "var(--accent)";
      const initiale = (a.nom || "?").trim().charAt(0).toUpperCase();

      const carte = document.createElement("div");
      carte.className = "carte";
      carte.innerHTML = `
        <div class="haut2">
          <div class="logo" data-site="${echapper(a.site || SITES[(a.nom || "").trim().toLowerCase()] || "")}" data-ini="${echapper(initiale)}" style="background:${couleur(a.categorie)}">${echapper(initiale)}</div>
          <div class="infos">
            <div class="nom">${echapper(a.nom)}</div>
            <div class="sous">${echapper(a.categorie || "Autre")} · ${enTexte(parseDate(a.echeance))}</div>
          </div>
          <div class="prix">
            <div class="montant">${euros(a.montant)}</div>
            <div class="per">par ${LIBELLE[a.periode]}</div>
          </div>
        </div>
        <div class="barre"><div style="width:${pct}%;background:${bc}"></div></div>
        <div class="pied">
          <span class="badge" style="background:${badgeFond};color:${badgeTexte}">Prélèvement ${quand(j)}</span>
          <button class="supp" data-id="${a.id}">Supprimer</button>
        </div>`;
      conteneur.appendChild(carte);
    });
    // Logos : image du site via un service d'icônes (DuckDuckGo), sinon la première lettre
    conteneur.querySelectorAll(".logo[data-site]").forEach(bloc => {
      const site = bloc.dataset.site;
      if (!site) return;
      const img = document.createElement("img");
      img.alt = "";
      img.src = "https://icons.duckduckgo.com/ip3/" + encodeURIComponent(site) + ".ico";
      img.onerror = () => { img.remove(); bloc.classList.remove("avec-image"); bloc.textContent = bloc.dataset.ini; };
      img.onload = () => { bloc.classList.add("avec-image"); bloc.textContent = ""; bloc.appendChild(img); };
    });
    conteneur.querySelectorAll(".supp").forEach(b => {
      b.onclick = () => {
        if (!confirm("Supprimer cet abonnement ?")) return;
        sauver(charger().filter(x => x.id !== b.dataset.id));
        rendu();
      };
    });

    const parCat = {};
    liste.forEach(a => { const k = a.categorie || "Autre"; parCat[k] = (parCat[k] || 0) + mensuel(a); });
    const barres = document.getElementById("barres");
    const leg = document.getElementById("legende");
    barres.innerHTML = ""; leg.innerHTML = "";
    document.getElementById("cardRepart").style.display = liste.length ? "" : "none";
    Object.entries(parCat).sort((a, b) => b[1] - a[1]).forEach(([cat, v]) => {
      const pct = total ? (v / total) * 100 : 0;
      barres.insertAdjacentHTML("beforeend", `<div style="width:${pct}%;background:${couleur(cat)}"></div>`);
      leg.insertAdjacentHTML("beforeend", `<span><i style="background:${couleur(cat)}"></i>${echapper(cat)} · ${Math.round(pct)} %</span>`);
    });
  }

  // ---------- Fenêtre d'ajout ----------
  const voile = document.getElementById("voile");
  function ouvrir() { voile.classList.add("ouvert"); }
  function fermer() { voile.classList.remove("ouvert"); }
  ["actAjout", "navAjout"].forEach(id => document.getElementById(id).onclick = ouvrir);
  document.getElementById("btnAnnuler").onclick = fermer;
  voile.onclick = e => { if (e.target === voile) fermer(); };

  document.getElementById("categorie").onchange = e => {
    const autre = e.target.value === "Autre";
    document.getElementById("autreBloc").style.display = autre ? "grid" : "none";
    if (autre) document.getElementById("categorieAutre").focus();
  };

  document.getElementById("formulaire").onsubmit = e => {
    e.preventDefault();
    const sel = document.getElementById("categorie").value;
    const cat = sel === "Autre" ? (document.getElementById("categorieAutre").value.trim() || "Autre") : sel;
    const l = charger();
    l.push({
      id: String(Date.now()),
      nom: document.getElementById("nom").value.trim(),
      montant: parseFloat(document.getElementById("montant").value),
      periode: document.getElementById("periode").value,
      echeance: document.getElementById("echeance").value,
      categorie: cat,
      site: document.getElementById("site").value.trim()
    });
    if (!sauver(l)) {
      document.getElementById("erreur").textContent = "Enregistrement impossible : ouvrez ce fichier dans Chrome.";
      return;
    }
    e.target.reset();
    document.getElementById("autreBloc").style.display = "none";
    document.getElementById("erreur").textContent = "";
    fermer();
    rendu();
  };

  // ---------- Barre du bas ----------
  function defiler(id) { document.getElementById(id).scrollIntoView({ behavior: "smooth", block: "start" }); }
  function activer(id) {
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("on"));
    document.getElementById(id).classList.add("on");
  }
  document.getElementById("navAccueil").onclick = () => { activer("navAccueil"); window.scrollTo({ top: 0, behavior: "smooth" }); };
  document.getElementById("navStats").onclick = () => { activer("navStats"); defiler("ancreRepart"); };
  document.getElementById("actStats").onclick = () => { activer("navStats"); defiler("ancreRepart"); };
  document.getElementById("navAlertes").onclick = () => { activer("navAlertes"); defiler("zoneAlertes"); };
  document.getElementById("actAlertes").onclick = () => { activer("navAlertes"); defiler("zoneAlertes"); };
  document.getElementById("navListe").onclick = () => { activer("navListe"); triParDate = !triParDate; rendu(); defiler("liste"); };
  document.getElementById("triInfo").onclick = () => { triParDate = !triParDate; rendu(); };

  rendu();
</script>
</body>
</html>
