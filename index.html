<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
<title>Mes abonnements</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--texte); font-family: Inter, system-ui, -apple-system, Roboto, sans-serif; padding-bottom: 110px; transition: background .6s, color .6s; }
  body { --bg: #0c0f0d; --carte: #161b18; --carte2: #1e2420; --texte: #f1f5f2; --muet: #8a948d; --ligne: rgba(255,255,255,.07);
    --accent: #b8f5c2; --accent-texte: #0b1a10; --glow: rgba(126,232,154,.3);
    --solde: linear-gradient(150deg, #b8f5c2 0%, #7ee89a 55%, #4fd17a 100%); --solde-texte: #0b1a10;
    --nav: #151a17; --rouge: #ff6b6b; --orange: #ffb547; --ok: #7ee89a; }
  .ecran { max-width: 430px; margin: 0 auto; padding: 18px 16px 0; }
  .vue { display: none; }
  .vue.on { display: block; }

  .haut { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .haut .salut { color: var(--muet); font-size: .85rem; }
  .haut .titre { font-size: 1.35rem; font-weight: 800; margin-top: 2px; }
  .rond { width: 42px; height: 42px; border-radius: 50%; background: var(--carte2); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--accent); }
  h2 { font-size: 1.05rem; margin: 22px 0 10px; }

  .solde { border-radius: 26px; padding: 20px; background: var(--solde); color: var(--solde-texte); box-shadow: 0 12px 40px var(--glow); }
  .solde .label { font-size: .85rem; opacity: .75; font-weight: 600; }
  .solde .montant { font-size: 2.4rem; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 6px; }
  .solde .an { font-size: .9rem; opacity: .8; font-weight: 600; }

  .carte { background: var(--carte); border-radius: 20px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--ligne); }
  .ligne { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .gauche { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #111; flex: 0 0 auto; box-shadow: 0 0 14px var(--glow); overflow: hidden; }
  .logo img { width: 28px; height: 28px; object-fit: contain; }
  .logo.avec-image { background: #fff !important; }
  .infos { flex: 1; min-width: 0; }
  .nom { font-weight: 700; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sous { font-size: .75rem; color: var(--muet); margin-top: 2px; }
  .prix { text-align: right; white-space: nowrap; }
  .prix .montant { font-weight: 800; font-size: 1rem; }
  .prix .per { font-size: .72rem; color: var(--muet); }
  .supp { background: none; border: none; color: var(--rouge); font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer; padding: 6px 0 0; }
  .vide { text-align: center; color: var(--muet); padding: 40px 10px; font-size: .92rem; }
  .badge { font-size: .72rem; padding: 3px 9px; border-radius: 999px; font-weight: 700; display: inline-block; margin-top: 6px; }

  .chip-ligne { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-bottom: 12px; }
  .chip-ligne::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: var(--carte); border: 1px solid var(--ligne); color: var(--muet); padding: 8px 14px; border-radius: 999px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
  .chip.actif { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); }

  .repart { display: flex; height: 12px; border-radius: 8px; overflow: hidden; background: var(--carte2); }
  .repart div { height: 100%; }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: .78rem; color: var(--muet); }
  .legende i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  .stat2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .stat2 .carte { margin: 0; }
  .stat2 .v { font-size: 1.25rem; font-weight: 800; margin-top: 4px; }

  .alerte { background: rgba(255,181,71,.12); border: 1px solid rgba(255,181,71,.35); color: var(--orange); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; font-size: .9rem; }
  .alerte.urgent { background: rgba(255,107,107,.12); border-color: rgba(255,107,107,.4); color: var(--rouge); }

  .theme { display: flex; justify-content: space-between; align-items: center; background: var(--carte); border: 1px solid var(--ligne); border-radius: 999px; padding: 6px 6px 6px 14px; font-size: .8rem; color: var(--muet); margin-top: 6px; }
  .theme b { color: var(--texte); font-weight: 700; }
  .theme button { background: var(--accent); color: var(--accent-texte); border: none; border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 700; font-size: .78rem; cursor: pointer; }
  .points { display: inline-flex; gap: 5px; margin-right: 8px; vertical-align: middle; }
  .points i { width: 6px; height: 6px; border-radius: 50%; background: var(--muet); opacity: .4; transition: all .4s; }
  .points i.on { opacity: 1; background: var(--accent); width: 14px; border-radius: 4px; }

  .tri { color: var(--accent); font-size: .85rem; font-weight: 600; cursor: pointer; background: none; border: none; font: inherit; padding: 0; }

  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; width: calc(100% - 32px); max-width: 398px; height: 70px;
    background: var(--nav); border: 1px solid var(--ligne); border-radius: 26px; display: flex; justify-content: space-around; align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 5; transition: background .6s; }
  .nav button { background: none; border: none; color: var(--muet); font: inherit; font-size: .68rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px 10px; }
  .nav button.on { color: var(--accent); }
  .nav button .ic { font-size: 1.2rem; }
  .nav .fab { width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-texte); font-size: 1.9rem; font-weight: 300; display: flex; align-items: center; justify-content: center; margin-top: -26px; box-shadow: 0 8px 24px var(--glow); padding: 0; }

  .voile { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .voile.ouvert { display: flex; }
  .feuille { background: var(--nav); width: 100%; max-width: 430px; border-radius: 26px 26px 0 0; padding: 22px 18px 28px; max-height: 92vh; overflow-y: auto; }
  .feuille h3 { margin: 0 0 14px; font-size: 1.1rem; }
  form { display: grid; gap: 12px; }
  label { font-size: .78rem; color: var(--muet); display: grid; gap: 6px; }
  input, select { background: var(--carte2); color: var(--texte); border: 1px solid var(--ligne); border-radius: 14px; padding: 13px; font: inherit; font-size: 1rem; width: 100%; color-scheme: dark; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .erreur { color: var(--rouge); font-size: .85rem; min-height: 1em; }
  .boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: none; border-radius: 16px; padding: 14px; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; }
  .btn.principal { background: var(--accent); color: var(--accent-texte); }
  .btn.fantome { background: var(--carte2); color: var(--texte); }
  #autreBloc { display: none; }
  .pts { display: flex; justify-content: center; gap: 12px; margin: 14px 0 6px; }
  .pts button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; transition: transform .2s, border-color .2s; }
  .pts button:hover { transform: scale(1.1); }
  .pts button.on { border-color: var(--texte); transform: scale(1.18); }
</style>
</head>
<body>

<div class="ecran">

  <!-- ACCUEIL : l'essentiel seulement -->
  <section class="vue on" id="vAccueil">
    <div class="haut">
      <div>
        <div class="salut" id="salut">Bonjour</div>
        <div class="titre">Mes abonnements</div>
      </div>
      <div class="rond">A</div>
    </div>
    <div class="solde">
      <div class="label">Dépense mensuelle</div>
      <div class="montant" id="totalMois">0,00 €</div>
      <div class="an" id="totalAn">0,00 € par an</div>
    </div>
    <div class="pts" id="pts"></div>
    <h2>Prochains prélèvements</h2>
    <div id="accueilListe"></div>
  </section>

  <!-- STATS : répartition + thème -->
  <section class="vue" id="vStats">
    <div class="haut"><div><div class="titre">Statistiques</div></div></div>
    <div class="stat2">
      <div class="carte"><div class="sous">Par mois</div><div class="v" id="sMois">0,00 €</div></div>
      <div class="carte"><div class="sous">Par an</div><div class="v" id="sAn">0,00 €</div></div>
    </div>
    <h2>Répartition</h2>
    <div class="carte" id="cardRepart">
      <div class="repart" id="barres"></div>
      <div class="legende" id="legende"></div>
    </div>
  </section>

  <!-- ALERTES -->
  <section class="vue" id="vAlertes">
    <div class="haut"><div><div class="titre">Alertes</div></div></div>
    <div id="alertesListe"></div>
  </section>

  <!-- LISTE : tous les abonnements, avec suppression et filtres -->
  <section class="vue" id="vListe">
    <div class="haut"><div><div class="titre">Tous mes abonnements</div></div></div>
    <div class="chip-ligne" id="filtres"></div>
    <div class="ligne" style="margin-bottom:10px"><span class="sous" id="compte"></span><button class="tri" id="triBtn">Par date</button></div>
    <div id="liste"></div>
  </section>

</div>

<nav class="nav">
  <button class="on" data-vue="vAccueil"><span class="ic">⌂</span>Accueil</button>
  <button data-vue="vStats"><span class="ic">◔</span>Stats</button>
  <button class="fab" id="navAjout" aria-label="Ajouter">+</button>
  <button data-vue="vAlertes"><span class="ic">◉</span>Alertes</button>
  <button data-vue="vListe"><span class="ic">≡</span>Liste</button>
</nav>

<div class="voile" id="voile">
  <div class="feuille">
    <h3>Nouvel abonnement</h3>
    <form id="formulaire">
      <label>Nom
        <input type="text" id="nom" required placeholder="Ex. Netflix">
      </label>
      <div class="deux">
        <label>Montant (€)
          <input type="number" id="montant" step="0.01" min="0" required placeholder="13.49">
        </label>
        <label>Période
          <select id="periode">
            <option value="mois">Mensuel</option>
            <option value="trimestre">Trimestriel</option>
            <option value="an">Annuel</option>
          </select>
        </label>
      </div>
      <label>Prochain prélèvement
        <input type="date" id="echeance" required>
      </label>
      <label>Catégorie
        <select id="categorie">
          <option>Streaming</option>
          <option>Téléphone / Internet</option>
          <option>Logiciel</option>
          <option>Musique</option>
          <option>Jeux</option>
          <option>Transport</option>
          <option>Autre</option>
        </select>
      </label>
      <label id="autreBloc">Précisez la catégorie
        <input type="text" id="categorieAutre" placeholder="Ex. Hébergement serveur">
      </label>
      <label>Site web (facultatif, pour le logo)
        <input type="text" id="site" placeholder="Ex. netflix.com">
      </label>
      <div class="erreur" id="erreur"></div>
      <div class="boutons">
        <button type="button" class="btn fantome" id="btnAnnuler">Annuler</button>
        <button type="submit" class="btn principal">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ---------- Thèmes : 5 ambiances choisies à la main (pastilles sur l'accueil) ----------
  const THEMES = [
    { nom: "Nuit émeraude", pastille: "linear-gradient(135deg,#34d399,#10b981)", vars: { "--bg": "#07140f", "--carte": "#0f2a20", "--carte2": "#163a2d", "--texte": "#ecfdf5", "--muet": "#8fb7a6",
        "--ligne": "rgba(255,255,255,.07)", "--accent": "#34d399", "--accent-texte": "#04110b", "--glow": "rgba(52,211,153,.3)",
        "--solde": "linear-gradient(135deg,#34d399,#10b981)", "--solde-texte": "#06130e",
        "--nav": "#0c1f18", "--rouge": "#ff6b6b", "--orange": "#ffb547", "--ok": "#34d399" } },
    { nom: "Océan profond", pastille: "linear-gradient(135deg,#38bdf8,#6366f1)", vars: { "--bg": "#07111f", "--carte": "#0f1d33", "--carte2": "#172a48", "--texte": "#eef6ff", "--muet": "#8ea6c8",
        "--ligne": "rgba(255,255,255,.07)", "--accent": "#38bdf8", "--accent-texte": "#06131f", "--glow": "rgba(56,189,248,.3)",
        "--solde": "linear-gradient(135deg,#38bdf8,#6366f1)", "--solde-texte": "#ffffff",
        "--nav": "#0c1830", "--rouge": "#ff6b6b", "--orange": "#ffb547", "--ok": "#38bdf8" } },
    { nom: "Violet néon doux", pastille: "linear-gradient(135deg,#c084fc,#f472b6)", vars: { "--bg": "#15102e", "--carte": "#211a45", "--carte2": "#2c2459", "--texte": "#f7f2ff", "--muet": "#b1a7d9",
        "--ligne": "rgba(255,255,255,.08)", "--accent": "#c084fc", "--accent-texte": "#15102e", "--glow": "rgba(192,132,252,.35)",
        "--solde": "linear-gradient(135deg,#c084fc,#f472b6)", "--solde-texte": "#15102e",
        "--nav": "#1b1540", "--rouge": "#ff5c7a", "--orange": "#ffb547", "--ok": "#f472b6" } },
    { nom: "Braise", pastille: "linear-gradient(135deg,#fb923c,#f43f5e)", vars: { "--bg": "#1a0d0a", "--carte": "#2a1612", "--carte2": "#3a1f19", "--texte": "#fff3ec", "--muet": "#bf9d92",
        "--ligne": "rgba(255,255,255,.07)", "--accent": "#fb923c", "--accent-texte": "#1a0d0a", "--glow": "rgba(251,146,60,.35)",
        "--solde": "linear-gradient(135deg,#fb923c,#f43f5e)", "--solde-texte": "#1a0d0a",
        "--nav": "#22120e", "--rouge": "#ff6b6b", "--orange": "#ffd27a", "--ok": "#fb923c" } },
    { nom: "Forêt dorée", pastille: "linear-gradient(135deg,#facc15,#84cc16)", vars: { "--bg": "#0e1409", "--carte": "#18200f", "--carte2": "#223016", "--texte": "#f7fbe9", "--muet": "#a4b08a",
        "--ligne": "rgba(255,255,255,.07)", "--accent": "#facc15", "--accent-texte": "#0e1409", "--glow": "rgba(250,204,21,.3)",
        "--solde": "linear-gradient(135deg,#facc15,#84cc16)", "--solde-texte": "#0e1409",
        "--nav": "#141c0c", "--rouge": "#ff6b6b", "--orange": "#ffb547", "--ok": "#84cc16" } }
  ];
  let indexTheme = 0;
  function appliquerTheme(i) {
    indexTheme = i;
    const t = THEMES[i];
    Object.entries(t.vars).forEach(([k, v]) => document.body.style.setProperty(k, v));
    document.getElementById("pts").innerHTML = THEMES.map((th, k) =>
      `<button type="button" class="${k === i ? "on" : ""}" style="background:${th.pastille}" title="${th.nom}" aria-label="${th.nom}" onclick="choisirTheme(${k})"></button>`).join("");
  }
  function choisirTheme(k) {
    appliquerTheme(k);
    try { localStorage.setItem("theme-choisi", String(k)); } catch (e) {}
  }
  let memo = 0;
  try { memo = parseInt(localStorage.getItem("theme-choisi") || "0", 10) || 0; } catch (e) {}
  appliquerTheme(memo < THEMES.length ? memo : 0);

  // ---------- Données ----------
  const CLE = "mes-abonnements-v2";
  const JOURS_ALERTE = 7;
  const MOIS = { mois: 1, trimestre: 3, an: 12 };
  const LIBELLE = { mois: "mois", trimestre: "trimestre", an: "an" };
  const COULEURS = { "Streaming": "#ff7a8a", "Téléphone / Internet": "#7ab8ff", "Logiciel": "#c4a7ff", "Musique": "#7ee89a", "Jeux": "#ffc857", "Transport": "#6ee7f5", "Autre": "#b8c0ba" };
  const SITES = { "crunchyroll": "crunchyroll.com", "claude": "claude.ai", "hetzner": "hetzner.com", "cloudflare": "cloudflare.com" };
  const DEPART = [
    { nom: "Crunchyroll", montant: 6.99, periode: "mois", echeance: "2026-11-10", categorie: "Streaming" },
    { nom: "Claude", montant: 21.60, periode: "mois", echeance: "2026-11-28", categorie: "Logiciel" },
    { nom: "Hetzner", montant: 6.59, periode: "mois", echeance: "2026-12-03", categorie: "Autre" },
    { nom: "Cloudflare", montant: 20.00, periode: "mois", echeance: "2026-12-07", categorie: "Autre" }
  ];
  let filtre = "Tous", triParDate = true;

  function charger() { try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; } }
  function sauver(l) { try { localStorage.setItem(CLE, JSON.stringify(l)); return true; } catch (e) { return false; } }
  if (!localStorage.getItem("seed-v1")) {
    try {
      if (!localStorage.getItem(CLE)) localStorage.setItem(CLE, JSON.stringify(DEPART.map((a, i) => ({ id: "dep" + i, ...a }))));
      localStorage.setItem("seed-v1", "1");
    } catch (e) {}
  }

  function aujourdhui() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function parseDate(s) { const [a, m, j] = s.split("-").map(Number); return new Date(a, m - 1, j); }
  function versTexte(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function avancer(d, p) { const n = new Date(d); n.setMonth(n.getMonth() + MOIS[p]); return n; }
  function enTexte(d) { return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }); }
  function joursAvant(s) { return Math.round((parseDate(s) - aujourdhui()) / 86400000); }
  function mettreAJour(l) {
    const auj = aujourdhui(); let m = false;
    l.forEach(a => { let d = parseDate(a.echeance); while (d < auj) { d = avancer(d, a.periode); m = true; } a.echeance = versTexte(d); });
    if (m) sauver(l);
    return l;
  }
  function euros(n) { return n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" }); }
  function echapper(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function couleur(c) { return COULEURS[c] || COULEURS["Autre"]; }
  function mensuel(a) { return a.montant / MOIS[a.periode]; }
  function quand(j) { return j <= 0 ? "aujourd'hui" : j === 1 ? "demain" : `dans ${j} j`; }
  function siteDe(a) { return a.site || SITES[(a.nom || "").trim().toLowerCase()] || ""; }

  // Logo : image du site, ou la première lettre si elle n'arrive pas
  function logoHTML(a) {
    const ini = (a.nom || "?").trim().charAt(0).toUpperCase();
    return `<div class="logo" data-site="${echapper(siteDe(a))}" data-ini="${echapper(ini)}" style="background:${couleur(a.categorie)}">${echapper(ini)}</div>`;
  }
  function remplirLogos(racine) {
    racine.querySelectorAll(".logo[data-site]").forEach(bloc => {
      const site = bloc.dataset.site;
      if (!site) return;
      const img = document.createElement("img");
      img.alt = "";
      img.onload = () => { bloc.classList.add("avec-image"); bloc.textContent = ""; bloc.appendChild(img); };
      img.onerror = () => { bloc.classList.remove("avec-image"); };
      img.src = "https://icons.duckduckgo.com/ip3/" + encodeURIComponent(site) + ".ico";
    });
  }

  // ---------- Pages ----------
  function rendreAccueil(liste, total) {
    document.getElementById("totalMois").textContent = euros(total);
    document.getElementById("totalAn").textContent = euros(total * 12) + " par an";
    const h = new Date().getHours();
    document.getElementById("salut").textContent = h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonsoir";
    const triees = [...liste].sort((a, b) => a.echeance.localeCompare(b.echeance));
    const c = document.getElementById("accueilListe");
    c.innerHTML = triees.length ? "" : '<div class="vide">Aucun abonnement.</div>';
    triees.forEach(a => {
      const j = joursAvant(a.echeance);
      c.insertAdjacentHTML("beforeend", `
        <div class="carte"><div class="ligne">
          <div class="gauche">${logoHTML(a)}<div class="infos"><div class="nom">${echapper(a.nom)}</div>
            <div class="sous">${enTexte(parseDate(a.echeance))} · ${quand(j)}</div></div></div>
          <div class="prix"><div class="montant">${euros(a.montant)}</div><div class="per">par ${LIBELLE[a.periode]}</div></div>
        </div></div>`);
    });
    remplirLogos(c);
  }

  function rendreStats(liste, total) {
    document.getElementById("sMois").textContent = euros(total);
    document.getElementById("sAn").textContent = euros(total * 12);
    const parCat = {};
    liste.forEach(a => { const k = a.categorie || "Autre"; parCat[k] = (parCat[k] || 0) + mensuel(a); });
    const barres = document.getElementById("barres"), leg = document.getElementById("legende");
    barres.innerHTML = ""; leg.innerHTML = "";
    document.getElementById("cardRepart").style.display = liste.length ? "" : "none";
    Object.entries(parCat).sort((a, b) => b[1] - a[1]).forEach(([cat, v]) => {
      const pct = total ? (v / total) * 100 : 0;
      barres.insertAdjacentHTML("beforeend", `<div style="width:${pct}%;background:${couleur(cat)}"></div>`);
      leg.insertAdjacentHTML("beforeend", `<span><i style="background:${couleur(cat)}"></i>${echapper(cat)} · ${Math.round(pct)} %</span>`);
    });
  }

  function rendreAlertes(liste) {
    const c = document.getElementById("alertesListe");
    c.innerHTML = "";
    const proches = liste.filter(a => joursAvant(a.echeance) <= JOURS_ALERTE)
      .sort((a, b) => a.echeance.localeCompare(b.echeance));
    if (!proches.length) { c.innerHTML = '<div class="vide">Aucune alerte pour le moment.<br>Les prélèvements dans les 7 prochains jours s\'affichent ici.</div>'; return; }
    proches.forEach(a => {
      const j = joursAvant(a.echeance);
      c.insertAdjacentHTML("beforeend", `<div class="alerte${j <= 2 ? " urgent" : ""}">${echapper(a.nom)} (${euros(a.montant)}) se prélève ${quand(j)}.</div>`);
    });
  }

  function rendreListe(liste) {
    const cats = ["Tous", ...new Set(liste.map(a => a.categorie || "Autre"))];
    if (!cats.includes(filtre)) filtre = "Tous";
    const f = document.getElementById("filtres");
    f.innerHTML = "";
    cats.forEach(cat => {
      const b = document.createElement("button");
      b.className = "chip" + (cat === filtre ? " actif" : "");
      b.textContent = cat;
      b.onclick = () => { filtre = cat; rendu(); };
      f.appendChild(b);
    });
    const vues = liste.filter(a => filtre === "Tous" || (a.categorie || "Autre") === filtre)
      .sort((a, b) => triParDate ? a.echeance.localeCompare(b.echeance) : a.nom.localeCompare(b.nom));
    document.getElementById("triBtn").textContent = triParDate ? "Par date" : "Par nom";
    document.getElementById("compte").textContent = vues.length + " abonnement" + (vues.length > 1 ? "s" : "");
    const c = document.getElementById("liste");
    c.innerHTML = vues.length ? "" : '<div class="vide">Aucun abonnement ici.</div>';
    vues.forEach(a => {
      const j = joursAvant(a.echeance);
      const bg = j <= 2 ? "rgba(255,107,107,.15)" : j <= JOURS_ALERTE ? "rgba(255,181,71,.15)" : "rgba(126,232,154,.12)";
      const tx = j <= 2 ? "var(--rouge)" : j <= JOURS_ALERTE ? "var(--orange)" : "var(--accent)";
      c.insertAdjacentHTML("beforeend", `
        <div class="carte">
          <div class="ligne">
            <div class="gauche">${logoHTML(a)}<div class="infos"><div class="nom">${echapper(a.nom)}</div>
              <div class="sous">${echapper(a.categorie || "Autre")} · ${enTexte(parseDate(a.echeance))}</div>
              <span class="badge" style="background:${bg};color:${tx}">${quand(j)}</span></div></div>
            <div class="prix"><div class="montant">${euros(a.montant)}</div><div class="per">par ${LIBELLE[a.periode]}</div></div>
          </div>
          <button class="supp" data-id="${a.id}">Supprimer</button>
        </div>`);
    });
    remplirLogos(c);
    c.querySelectorAll(".supp").forEach(b => {
      b.onclick = () => {
        if (!confirm("Supprimer cet abonnement ?")) return;
        sauver(charger().filter(x => x.id !== b.dataset.id));
        rendu();
      };
    });
  }

  function rendu() {
    const liste = mettreAJour(charger());
    const total = liste.reduce((s, a) => s + mensuel(a), 0);
    rendreAccueil(liste, total);
    rendreStats(liste, total);
    rendreAlertes(liste);
    rendreListe(liste);
  }

  // ---------- Navigation ----------
  function montrer(id) {
    document.querySelectorAll(".vue").forEach(v => v.classList.toggle("on", v.id === id));
    document.querySelectorAll(".nav button[data-vue]").forEach(b => b.classList.toggle("on", b.dataset.vue === id));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  document.querySelectorAll(".nav button[data-vue]").forEach(b => b.onclick = () => montrer(b.dataset.vue));
  document.getElementById("triBtn").onclick = () => { triParDate = !triParDate; rendu(); };

  // ---------- Ajout ----------
  const voile = document.getElementById("voile");
  document.getElementById("navAjout").onclick = () => voile.classList.add("ouvert");
  document.getElementById("btnAnnuler").onclick = () => voile.classList.remove("ouvert");
  voile.onclick = e => { if (e.target === voile) voile.classList.remove("ouvert"); };
  document.getElementById("categorie").onchange = e => {
    const autre = e.target.value === "Autre";
    document.getElementById("autreBloc").style.display = autre ? "grid" : "none";
    if (autre) document.getElementById("categorieAutre").focus();
  };
  document.getElementById("formulaire").onsubmit = e => {
    e.preventDefault();
    const sel = document.getElementById("categorie").value;
    const cat = sel === "Autre" ? (document.getElementById("categorieAutre").value.trim() || "Autre") : sel;
    const l = charger();
    l.push({
      id: String(Date.now()),
      nom: document.getElementById("nom").value.trim(),
      montant: parseFloat(document.getElementById("montant").value),
      periode: document.getElementById("periode").value,
      echeance: document.getElementById("echeance").value,
      categorie: cat,
      site: document.getElementById("site").value.trim()
    });
    if (!sauver(l)) { document.getElementById("erreur").textContent = "Enregistrement impossible : ouvrez la page dans Chrome."; return; }
    e.target.reset();
    document.getElementById("autreBloc").style.display = "none";
    document.getElementById("erreur").textContent = "";
    voile.classList.remove("ouvert");
    rendu();
  };

  rendu();
</script>
</body>
</html>
